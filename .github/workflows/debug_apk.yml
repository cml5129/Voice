name: Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Build
        run: ./gradlew :app:assembleFreeDebug
      - uses: actions/upload-artifact@v7
        with:
          name: voice-free-debug
          path: app/build/outputs/apk/free/debug/*.apk
